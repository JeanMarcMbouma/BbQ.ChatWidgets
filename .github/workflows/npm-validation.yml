name: NPM Validation

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'js/**'
      - 'js-angular/**'
      - 'js-react/**'
      - 'Sample/BbQ.ChatWidgets.Sample.React/**'
      - 'Sample/BbQ.ChatWidgets.Sample.Angular/**'
      - '.github/workflows/npm-*.yml'
      - 'test-fixtures/**'
  push:
    branches: [ "master" ]
    paths:
      - 'js/**'
      - 'js-angular/**'
      - 'js-react/**'
      - 'Sample/BbQ.ChatWidgets.Sample.React/**'
      - 'Sample/BbQ.ChatWidgets.Sample.Angular/**'
      - '.github/workflows/npm-*.yml'
      - 'test-fixtures/**'

permissions:
  contents: read

jobs:
  build-and-test-react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18', '19']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Build core
      working-directory: js
      run: |
        npm ci
        npm run build
    - name: Validate React library
      working-directory: js-react
      run: |
        npm ci
        npx --yes npm@11 install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
        npm run build
        npm test
        npm audit --omit=dev
    - name: Verify installed package on React 18 and 19
      if: matrix.react == '18'
      working-directory: js-react
      run: npm run test:package

  build-and-test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci

    - name: Audit runtime dependencies
      run: npm audit --omit=dev

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

    - name: Verify installed package
      run: npm run test:package

  build-and-test-angular:
    runs-on: ubuntu-latest
    needs: build-and-test-core # Ensure core builds first
    defaults:
      run:
        working-directory: js-angular

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Build core package
      run: |
        cd ../js
        npm ci
        npm run build

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

    - name: Build Angular consuming sample
      working-directory: Sample/BbQ.ChatWidgets.Sample.Angular/ClientApp
      run: |
        npm ci
        npm run build
        npm audit --omit=dev

  build-react-playground:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Build core
      working-directory: js
      run: |
        npm ci
        npm run build
    - name: Build React library
      working-directory: js-react
      run: |
        npm ci
        npm run build
    - name: Build React sample
      working-directory: Sample/BbQ.ChatWidgets.Sample.React/ClientApp
      run: |
        npm ci
        npm run build
    - name: Audit React runtime dependencies
      working-directory: Sample/BbQ.ChatWidgets.Sample.React/ClientApp
      run: npm audit --omit=dev
    - name: Install browser
      working-directory: Sample/BbQ.ChatWidgets.Sample.React/ClientApp
      run: npx playwright install --with-deps chromium
    - name: Test playground on desktop and mobile
      working-directory: Sample/BbQ.ChatWidgets.Sample.React/ClientApp
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        retention-days: 7
        name: playground-browser-results
        path: Sample/BbQ.ChatWidgets.Sample.React/ClientApp/test-results
